name: MalGuard One GiB Streaming Acceptance
on:
  push:
    branches:
      - feat/chunked-scanning-1gib-20261120

permissions:
  contents: read

jobs:
  one-gib-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use pinned Node.js setup action
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run real 1 GiB bounded scanning acceptance with inert sparse file
        run: node tests/one-gib-stream-acceptance.js
