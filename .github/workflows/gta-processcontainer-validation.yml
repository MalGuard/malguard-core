name: GTA ProcessContainer Validation

on:
  push:
    branches:
      - dev/gta-processcontainer-isolation
  pull_request:
    branches:
      - dev/gta-plugin-sandbox-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: GTA ProcessContainer regression
        run: node tests/gta-processcontainer-isolation.test.js

      - name: Full engineering regression suite
        run: npm test

  processcontainer-live-synthetic:
    name: MXC ProcessContainer live synthetic acceptance
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Microsoft MXC SDK
        shell: pwsh
        run: npm install --no-save --package-lock=false @microsoft/mxc-sdk@0.8.0

      - name: Build static ARM64 harmless fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S native/mxc-synthetic-child -B build/mxc-synthetic-child -A ARM64
          cmake --build build/mxc-synthetic-child --config Release --parallel
          $exe = Resolve-Path 'build/mxc-synthetic-child/Release/MalGuardMxcSyntheticChild.exe'
          "MALGUARD_MXC_CHILD_EXE=$($exe.Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate real ProcessContainer boundary with harmless fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node .\tests\mxc-processcontainer-live-validation.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "MXC ProcessContainer live validation failed with exit code $LASTEXITCODE"
          }

      - name: Validate GTA routing regression on Windows
        shell: pwsh
        run: node .\tests\gta-processcontainer-isolation.test.js
