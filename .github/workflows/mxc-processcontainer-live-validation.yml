name: MalGuard MXC ProcessContainer Live Validation

on:
  push:
    branches:
      - dev/appcontainer-native-sandbox
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mxc-processcontainer-live-validation:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Windows 11 runner
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Architecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "Node: $(node --version)"
          Write-Host "npm: $(npm --version)"

      - name: Install pinned Microsoft MXC SDK
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false @microsoft/mxc-sdk@0.8.0

      - name: Prepare ephemeral host for MXC AppContainer fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostPrep = Get-ChildItem '.\node_modules\@microsoft\mxc-sdk' -Recurse -Filter 'wxc-host-prep.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $hostPrep) { throw 'wxc-host-prep.exe not found in pinned MXC SDK package' }
          Write-Host "MXC host prep: $hostPrep"
          & $hostPrep prepare-system-drive
          if ($LASTEXITCODE -ne 0) { throw "prepare-system-drive failed with exit code $LASTEXITCODE" }
          & $hostPrep prepare-null-device --no-sacl
          if ($LASTEXITCODE -ne 0) { throw "prepare-null-device failed with exit code $LASTEXITCODE" }

      - name: Run synthetic MXC ProcessContainer live acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node .\tests\mxc-processcontainer-live-validation.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "MXC ProcessContainer live validation failed with exit code $LASTEXITCODE"
          }

      - name: Remove persistent MXC system-drive ACEs
        if: always()
        shell: pwsh
        run: |
          $hostPrep = Get-ChildItem '.\node_modules\@microsoft\mxc-sdk' -Recurse -Filter 'wxc-host-prep.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($hostPrep) {
            & $hostPrep unprepare-system-drive
            if ($LASTEXITCODE -ne 0) { Write-Warning "unprepare-system-drive exited $LASTEXITCODE" }
          }
