name: MalGuard Windows Release Candidate

on:
  pull_request:
    paths:
      - 'desktop-app/sandbox/**'
      - 'desktop-app/update/**'
      - 'desktop-app/integrity/**'
      - 'desktop-app/metrics/**'
      - 'api/install-hardware-report.js'
      - 'tests/compatibility-profile.test.js'
      - 'tests/install-hardware-report-api.test.js'
      - 'desktop-app/server.js'
      - 'tests/first-launch-counter.test.js'
      - 'PRIVACY.md'
      - 'native/sandbox-containment-probe/**'
      - 'native/windows-launcher/**'
      - 'tests/windows-launcher-startup.ps1'
      - 'tests/sandbox-*.test.js'
      - 'tests/secure-update.test.js'
      - 'tests/release-trust.test.js'
      - 'tests/runtime-package-integrity.test.js'
      - 'tests/public-release-policy.test.js'
      - 'tests/windows-installer-source.test.js'
      - 'tests/run-all.js'
      - 'tools/build-portable-package.js'
      - 'tools/build-windows-installer.ps1'
      - 'tools/windows-node-runtime-lock.json'
      - 'tools/stage-multi-engine-tools.ps1'
      - 'desktop-app/multi-engine/**'
      - 'tests/multi-engine-*.test.js'
      - 'tools/verify-release-candidate.js'
      - 'tools/sign-release-candidate.js'
      - 'tools/verify-signed-release.js'
      - 'tools/verify-windows-authenticode.ps1'
      - '.github/workflows/windows-release-candidate.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce trusted main release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          MALGUARD_PUSH_FORCED: ${{ github.event.forced }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MALGUARD_PUSH_FORCED -eq 'true') {
            throw 'Refusing to build a release artifact from a force-push to main.'
          }
          $parents = (git rev-list --parents -n 1 HEAD).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)
          if ($parents.Count -lt 3) {
            throw 'Refusing to build a release artifact from a direct/single-parent main commit. A PR merge commit is required.'
          }
          Write-Host 'Trusted main source topology PASS: non-forced PR merge commit.'

      - name: Setup exact Node.js for build tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Stage pinned Node runtime for installed scanner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath 'tools/windows-node-runtime-lock.json' -Raw | ConvertFrom-Json
          if ($lock.schemaVersion -ne '1.0.0' -or $lock.nodeVersion -ne '22.23.2') { throw 'unexpected Windows Node runtime lock' }
          $entry = $lock.architectures.'${{ matrix.arch }}'
          if (-not $entry) { throw 'missing Node runtime architecture lock' }
          $uri = [Uri]($lock.source + $entry.archive)
          if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'nodejs.org' -or $uri.Port -ne 443 -or $uri.UserInfo -or $uri.AbsolutePath -notlike '/dist/v22.23.2/*') {
            throw "untrusted Node runtime origin: $uri"
          }
          $archive = Join-Path $env:RUNNER_TEMP $entry.archive
          $response = Invoke-WebRequest -Uri $uri -OutFile $archive -MaximumRedirection 0 -PassThru
          if ([int]$response.StatusCode -ne 200) { throw "Node runtime download returned HTTP $($response.StatusCode)" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne ([string]$entry.sha256).ToLowerInvariant()) { throw 'Node runtime SHA-256 mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP "node-runtime-${{ matrix.arch }}"
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $node = Get-ChildItem -LiteralPath $extract -Filter node.exe -File -Recurse | Select-Object -First 1
          $license = Get-ChildItem -LiteralPath $extract -Filter LICENSE -File -Recurse | Select-Object -First 1
          if (-not $node -or -not $license) { throw 'verified Node archive is incomplete' }
          $target = Join-Path (Get-Location) 'desktop-app/runtime'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath $node.FullName -Destination (Join-Path $target 'node.exe') -Force
          Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $target 'NODE-LICENSE.txt') -Force
          Write-Host "Pinned Node runtime staged: $($lock.nodeVersion) / ${{ matrix.arch }} / $actual"

      - name: Stage pinned independent analysis engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -NonInteractive -File .\tools\stage-multi-engine-tools.ps1
          if ($LASTEXITCODE -ne 0) { throw "Multi-engine staging failed: $LASTEXITCODE" }

      - name: Real multi-engine benign PE smoke
        if: matrix.arch == 'x64'
        shell: pwsh
        env:
          MALGUARD_TSH_LIVE_MULTI_ENGINE: '1'
        run: node tests/multi-engine-live-windows.test.js


      - name: Build native MalGuard launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'malguard-windows-launcher'
          cmake -S native/windows-launcher -B $build -A '${{ matrix.cmake_arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'launcher configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'launcher build failed' }
          $launcher = Get-ChildItem -LiteralPath $build -Filter 'MalGuard.exe' -File -Recurse | Select-Object -First 1
          if (-not $launcher) { throw 'MalGuard.exe launcher was not produced' }
          $target = Join-Path (Get-Location) 'desktop-app/bin'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath $launcher.FullName -Destination (Join-Path $target 'MalGuard.exe') -Force

      - name: Run launcher startup regressions
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -NonInteractive -File .\tests\windows-launcher-startup.ps1 -Launcher (Resolve-Path 'desktop-app/bin/MalGuard.exe').Path -Node (Resolve-Path 'desktop-app/runtime/node.exe').Path
          if ($LASTEXITCODE -ne 0) { throw "Launcher startup regression failed: $LASTEXITCODE" }

      - name: Build native Sandbox containment probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'malguard-sandbox-containment-probe'
          cmake -S native/sandbox-containment-probe -B $build -A '${{ matrix.cmake_arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'containment probe configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'containment probe build failed' }
          $probe = Get-ChildItem -LiteralPath $build -Filter 'MalGuardSandboxContainmentProbe.exe' -File -Recurse | Select-Object -First 1
          if (-not $probe) { throw 'MalGuardSandboxContainmentProbe.exe was not produced' }
          $target = Join-Path (Get-Location) 'desktop-app/sandbox/bin'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath $probe.FullName -Destination (Join-Path $target 'MalGuardSandboxContainmentProbe.exe') -Force

      - name: Verify staged native/runtime components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('desktop-app/bin/MalGuard.exe','desktop-app/runtime/node.exe','desktop-app/runtime/NODE-LICENSE.txt','desktop-app/sandbox/bin/MalGuardSandboxContainmentProbe.exe','desktop-app/multi-engine/bin/ENGINE-BUNDLE.json','desktop-app/multi-engine/bin/yr.exe','desktop-app/multi-engine/bin/capa.exe','desktop-app/multi-engine/bin/floss.exe')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "release staging missing: $file" }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$file SHA-256: $hash"
          }

      - name: Verify native PE architecture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-PeMachine([string]$Path) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $Path))
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "not a PE file: $Path" }
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            if ($pe -lt 0 -or $pe + 6 -gt $bytes.Length -or $bytes[$pe] -ne 0x50 -or $bytes[$pe+1] -ne 0x45) { throw "invalid PE header: $Path" }
            return [BitConverter]::ToUInt16($bytes, $pe + 4)
          }
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }
          foreach ($file in @('desktop-app/bin/MalGuard.exe','desktop-app/runtime/node.exe','desktop-app/sandbox/bin/MalGuardSandboxContainmentProbe.exe')) {
            $actual = Get-PeMachine $file
            if ($actual -ne $expected) { throw ("PE architecture mismatch for {0}: expected 0x{1:X4}, got 0x{2:X4}" -f $file,$expected,$actual) }
            Write-Host ("PE architecture PASS: {0} = 0x{1:X4}" -f $file,$actual)
          }

      - name: Run Sandbox and release hardening regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/sandbox-backend.test.js
          node tests/sandbox-first-run-certification.test.js
          node tests/sandbox-telemetry.test.js
          node tests/first-launch-counter.test.js
          node tests/compatibility-profile.test.js
          node tests/install-hardware-report-api.test.js
          node tests/secure-update.test.js
          node tests/release-trust.test.js
          node tests/runtime-package-integrity.test.js
          node tests/packaging-foundation.test.js
          node tests/workflow-supply-chain.test.js
          node tests/public-release-policy.test.js
          node tests/windows-installer-source.test.js

      - name: Build sealed Windows runtime package
        shell: pwsh
        env:
          MALGUARD_SOURCE_COMMIT: ${{ github.sha }}
          MALGUARD_REQUIRE_MULTI_ENGINE_BUNDLE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/build-portable-package.js
          node tools/verify-release-candidate.js

      - name: Prove installed runtime is integrity-covered
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $root = Join-Path (Get-Location) "dist/malguard-desktop-$version"
          $sums = Get-Content -LiteralPath (Join-Path $root 'SHA256SUMS.txt') -Raw
          foreach ($file in @('desktop-app/bin/MalGuard.exe','desktop-app/runtime/node.exe','desktop-app/runtime/NODE-LICENSE.txt','desktop-app/sandbox/bin/MalGuardSandboxContainmentProbe.exe','desktop-app/multi-engine/bin/ENGINE-BUNDLE.json','desktop-app/multi-engine/bin/yr.exe','desktop-app/multi-engine/bin/capa.exe','desktop-app/multi-engine/bin/floss.exe')) {
            $target = Join-Path $root ($file -replace '/', '\')
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "packaged runtime missing: $file" }
            $escaped = [regex]::Escape($file)
            if ($sums -notmatch $escaped) { throw "packaged runtime is not integrity-covered: $file" }
          }

      - name: Archive Windows release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $name = "malguard-desktop-$version-windows-${{ matrix.arch }}.zip"
          $archive = Join-Path (Get-Location) "dist/$name"
          Compress-Archive -Path "dist/malguard-desktop-$version" -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii

      - name: Re-open and verify archived release candidate
        shell: pwsh
        env:
          MALGUARD_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $name = "malguard-desktop-$version-windows-${{ matrix.arch }}.zip"
          $archive = Join-Path (Get-Location) "dist/$name"
          $sumPath = "$archive.sha256"
          $expectedHash = ((Get-Content -LiteralPath $sumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expectedHash -ne $actualHash) { throw 'archived release SHA-256 sidecar does not match the archive' }

          $verifyRoot = Join-Path $env:RUNNER_TEMP "malguard-release-reopen-${{ matrix.arch }}"
          Remove-Item -LiteralPath $verifyRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $verifyRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $verifyRoot -Force
          $entries = @(Get-ChildItem -LiteralPath $verifyRoot -Force)
          if ($entries.Count -ne 1 -or -not $entries[0].PSIsContainer) { throw 'release archive must contain exactly one package root directory' }
          $packageRoot = $entries[0].FullName
          $manifestPath = Join-Path $packageRoot 'PACKAGE-MANIFEST.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) { throw 're-opened release archive is missing PACKAGE-MANIFEST.json' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:MALGUARD_SOURCE_COMMIT) { throw 're-opened archive source commit does not match workflow SHA' }

          node -e "const {verifyRuntimePackageIntegrity}=require('./desktop-app/integrity/runtime-integrity.js'); const r=verifyRuntimePackageIntegrity(process.argv[1],{requireSealed:true}); if(!r.ok||!r.sealed){console.error(r);process.exit(1)}; console.log('Re-opened archive runtime integrity PASS');" "$packageRoot"
          if ($LASTEXITCODE -ne 0) { throw 're-opened release archive failed runtime integrity verification' }

      - name: Build Windows Setup executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $root = Join-Path (Get-Location) "dist/malguard-desktop-$version"
          $setup = Join-Path (Get-Location) "dist/MalGuard-Setup-$version-windows-${{ matrix.arch }}.exe"
          & pwsh -NoLogo -NoProfile -NonInteractive -File .\tools\build-windows-installer.ps1 -PackageRoot $root -Architecture '${{ matrix.arch }}' -OutputPath $setup -DiagnosticOutputDirectory (Join-Path $env:RUNNER_TEMP "malguard-installer-test-${{ matrix.arch }}")
          if ($LASTEXITCODE -ne 0) { throw "Windows installer builder failed with exit code $LASTEXITCODE" }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($setup))" | Set-Content -LiteralPath "$setup.sha256" -Encoding ascii
          if ('${{ matrix.arch }}' -eq 'arm64') {
            Remove-Item -LiteralPath $setup -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "$setup.sha256" -Force -ErrorAction SilentlyContinue
            Write-Host 'ARM64 payload architecture PASS, but public Setup EXE is intentionally withheld: IExpress outer wrapper is x64.'
          }
          $signature = if (Test-Path -LiteralPath $setup) { Get-AuthenticodeSignature -LiteralPath $setup } else { $null }
          if ($signature) { Write-Host "Installer Authenticode state: $($signature.Status)" }
          Write-Host 'NOTE: this Setup is unsigned. It may be published only as an explicitly labeled Unsigned Preview with SHA-256 and source-commit provenance. It must never be represented as Authenticode-signed.'

      - name: Install x64 payload and verify local server startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $installScript = Join-Path $env:RUNNER_TEMP 'malguard-installer-test-x64/install.ps1'
          $installedRoot = Join-Path $env:LOCALAPPDATA 'Programs/MalGuard'
          $installedNode = Join-Path $env:LOCALAPPDATA 'Programs/MalGuard/desktop-app/runtime/node.exe'
          try {
            & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installScript
            if ($LASTEXITCODE -ne 0) { throw "Install script failed with exit code $LASTEXITCODE" }
            foreach ($relative in @('PACKAGE-MANIFEST.json','SHA256SUMS.txt','app.js','desktop-app/server.js','desktop-app/local-scan-upload.js','desktop-app/runtime/node.exe','desktop-app/multi-engine/bin/ENGINE-BUNDLE.json','desktop-app/multi-engine/bin/yr.exe','desktop-app/multi-engine/bin/capa.exe','desktop-app/multi-engine/bin/floss.exe')) {
              if (-not (Test-Path -LiteralPath (Join-Path $installedRoot $relative) -PathType Leaf)) { throw "Installed payload missing: $relative" }
            }
            $shell = New-Object -ComObject WScript.Shell
            $desktopLink = Join-Path $shell.SpecialFolders.Item('Desktop') 'GTA Guard.lnk'
            if (-not (Test-Path -LiteralPath $desktopLink -PathType Leaf)) { throw 'GTA Guard Desktop shortcut was not installed' }
            $link = $shell.CreateShortcut($desktopLink)
            if (-not [string]::Equals($link.TargetPath, (Join-Path $installedRoot 'desktop-app/bin/MalGuard.exe'), [StringComparison]::OrdinalIgnoreCase)) { throw 'GTA Guard Desktop shortcut points to the wrong executable' }
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18777/api/status' -TimeoutSec 2
                if ($status.ok -eq $true -and $status.product -eq 'MalGuard Desktop' -and $status.version -eq $version) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw 'Installed x64 server did not become ready at /api/status'
            }
            Write-Host 'Installed x64 payload runtime startup PASS: /api/status returned the expected product and version.'
          } finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -and [string]::Equals($_.ExecutablePath, $installedNode, [StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload trusted-main Windows installable release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-windows-${{ matrix.arch }}-release-candidate
          path: |
            dist/*-windows-${{ matrix.arch }}.zip
            dist/*-windows-${{ matrix.arch }}.zip.sha256
            dist/MalGuard-Setup-*-windows-${{ matrix.arch }}.exe
            dist/MalGuard-Setup-*-windows-${{ matrix.arch }}.exe.sha256
          if-no-files-found: error
          retention-days: 7
