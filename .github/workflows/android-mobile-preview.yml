name: MalGuard Android Mobile Preview

on:
  push:
    branches:
      - dev/android-mobile-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable debug APK
        shell: bash
        run: gradle -p android-preview :app:assembleDebug --no-daemon

      - name: Create SHA-256
        shell: bash
        run: |
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk MalGuard-Mobile-Preview.apk
          sha256sum MalGuard-Mobile-Preview.apk > MalGuard-Mobile-Preview.apk.sha256
          cat MalGuard-Mobile-Preview.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-mobile-preview-apk
          path: |
            MalGuard-Mobile-Preview.apk
            MalGuard-Mobile-Preview.apk.sha256
          if-no-files-found: error
          retention-days: 7
