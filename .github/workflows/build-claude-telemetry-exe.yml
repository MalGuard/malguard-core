name: Build Claude Telemetry Windows Test EXE

on:
  push:
    branches:
      - test/claude-telemetry-exe
    paths:
      - '.github/workflows/build-claude-telemetry-exe.yml'

permissions:
  contents: read

jobs:
  build-test-exe:
    name: Claude telemetry · Windows x64 verified test EXE
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout staging source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Reconstruct and verify exact Claude delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem -LiteralPath '.github/claude-telemetry-delta' -Filter 'part-*.txt' -File | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 Claude delta parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'claude-telemetry-delta.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'dd5781874467d2599eb83c4a4cf02db7dd78a037b815dcc83cca136224ec2cff'
          if ($actual -ne $expected) { throw "Claude delta SHA-256 mismatch: $actual" }
          Write-Host "Claude delta SHA-256 VERIFIED: $actual"

          $overlay = Join-Path $env:RUNNER_TEMP 'claude-overlay'
          Expand-Archive -LiteralPath $zip -DestinationPath $overlay -Force
          $files = Get-ChildItem -LiteralPath $overlay -File -Recurse
          if ($files.Count -ne 38) { throw "Expected 38 Claude files, found $($files.Count)" }
          Copy-Item -Path (Join-Path $overlay '*') -Destination (Get-Location) -Recurse -Force

      - name: Prepare isolated build tree and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Remove transfer/bootstrap files from this ephemeral build workspace only.
          Remove-Item -LiteralPath '.github/claude-telemetry-delta' -Recurse -Force
          if (Test-Path -LiteralPath '.github/workflows/prepare-claude-telemetry-exact.yml') {
            Remove-Item -LiteralPath '.github/workflows/prepare-claude-telemetry-exact.yml' -Force
          }

          # The uploaded Claude report identified this pre-existing workflow permission
          # mismatch. Fix it only inside this disposable checkout so the supply-chain
          # test can exercise the rest of the exact Claude source. Nothing is pushed.
          $publisher = '.github/workflows/publish-tsh-pro-preview.yml'
          $text = Get-Content -LiteralPath $publisher -Raw
          $old = "permissions:`n  actions: read`n  contents: write"
          if (-not $text.Contains($old)) {
            $old = "permissions:`r`n  actions: read`r`n  contents: write"
          }
          if (-not $text.Contains($old)) { throw 'Known publisher permission block was not found' }
          $newline = if ($old.Contains("`r`n")) { "`r`n" } else { "`n" }
          $text = $text.Replace($old, "permissions:${newline}  contents: read")
          [IO.File]::WriteAllText((Resolve-Path $publisher), $text, [Text.UTF8Encoding]::new($false))

          git config user.name "MalGuard Ephemeral Test Builder"
          git config user.email "malguard.security@gmail.com"
          git add -A
          git commit -m "ephemeral: materialize Claude telemetry delta dd578187"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to establish clean ephemeral source commit' }
          $localSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          "MALGUARD_SOURCE_COMMIT=$localSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLAUDE_LOCAL_COMMIT=$localSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (git status --porcelain) { throw 'Ephemeral build tree is not clean' }
          Write-Host "Ephemeral source commit: $localSha"

      - name: Run complete MalGuard test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tests/run-all.js
          if ($LASTEXITCODE -ne 0) { throw "Full test suite failed with exit code $LASTEXITCODE" }

      - name: Stage pinned Node runtime for installed scanner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content -LiteralPath 'tools/windows-node-runtime-lock.json' -Raw | ConvertFrom-Json
          if ($lock.schemaVersion -ne '1.0.0' -or $lock.nodeVersion -ne '22.23.2') { throw 'unexpected Windows Node runtime lock' }
          $entry = $lock.architectures.'x64'
          if (-not $entry) { throw 'missing Node runtime x64 lock' }
          $uri = [Uri]($lock.source + $entry.archive)
          if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'nodejs.org' -or $uri.Port -ne 443 -or $uri.UserInfo -or $uri.AbsolutePath -notlike '/dist/v22.23.2/*') {
            throw "untrusted Node runtime origin: $uri"
          }
          $archive = Join-Path $env:RUNNER_TEMP $entry.archive
          $response = Invoke-WebRequest -Uri $uri -OutFile $archive -MaximumRedirection 0 -PassThru
          if ([int]$response.StatusCode -ne 200) { throw "Node runtime download returned HTTP $($response.StatusCode)" }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne ([string]$entry.sha256).ToLowerInvariant()) { throw 'Node runtime SHA-256 mismatch' }
          $extract = Join-Path $env:RUNNER_TEMP 'node-runtime-x64'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $node = Get-ChildItem -LiteralPath $extract -Filter node.exe -File -Recurse | Select-Object -First 1
          $license = Get-ChildItem -LiteralPath $extract -Filter LICENSE -File -Recurse | Select-Object -First 1
          if (-not $node -or -not $license) { throw 'verified Node archive is incomplete' }
          $target = Join-Path (Get-Location) 'desktop-app/runtime'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -LiteralPath $node.FullName -Destination (Join-Path $target 'node.exe') -Force
          Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $target 'NODE-LICENSE.txt') -Force

      - name: Stage pinned YARA-X and capa
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engines = @(
            @{
              Name='yara-x'
              Uri='https://github.com/VirusTotal/yara-x/releases/download/v1.20.0/yara-x-v1.20.0-x86_64-pc-windows-msvc.zip'
              Sha256='b1e2840bac593aea353d2b2b341f5a862c9d61c0c406d9abbbad9e1fa35163a1'
              Exe='yr.exe'
            },
            @{
              Name='capa'
              Uri='https://github.com/mandiant/capa/releases/download/v9.4.0/capa-v9.4.0-windows.zip'
              Sha256='670ab1a58b81f59cb57533bf4021ac1e7033fbe9b5d5cc180f796976081e3bb5'
              Exe='capa.exe'
            }
          )
          foreach ($engine in $engines) {
            $uri = [Uri]$engine.Uri
            if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'github.com') { throw "untrusted engine origin: $uri" }
            $archive = Join-Path $env:RUNNER_TEMP ($engine.Name + '.zip')
            Invoke-WebRequest -Uri $uri -OutFile $archive
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $engine.Sha256) { throw "$($engine.Name) SHA-256 mismatch" }
            $extract = Join-Path $env:RUNNER_TEMP ('engine-' + $engine.Name)
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $exe = Get-ChildItem -LiteralPath $extract -Filter $engine.Exe -File -Recurse | Select-Object -First 1
            if (-not $exe) { throw "$($engine.Name) executable missing from verified archive" }
            $target = Join-Path (Get-Location) ('desktop-app/engines/' + $engine.Name)
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $target $engine.Exe) -Force
            & (Join-Path $target $engine.Exe) --version
            if ($LASTEXITCODE -ne 0) { throw "$($engine.Name) self-identification failed" }
          }

      - name: Build native launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'malguard-windows-launcher'
          cmake -S native/windows-launcher -B $build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'launcher configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'launcher build failed' }
          $launcher = Get-ChildItem -LiteralPath $build -Filter 'MalGuard.exe' -File -Recurse | Select-Object -First 1
          if (-not $launcher) { throw 'MalGuard.exe launcher was not produced' }
          New-Item -ItemType Directory -Path 'desktop-app/bin' -Force | Out-Null
          Copy-Item -LiteralPath $launcher.FullName -Destination 'desktop-app/bin/MalGuard.exe' -Force

      - name: Run launcher startup regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -NonInteractive -File .\tests\windows-launcher-startup.ps1 -Launcher (Resolve-Path 'desktop-app/bin/MalGuard.exe').Path -Node (Resolve-Path 'desktop-app/runtime/node.exe').Path
          if ($LASTEXITCODE -ne 0) { throw "Launcher startup regression failed: $LASTEXITCODE" }

      - name: Build Sandbox containment probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:RUNNER_TEMP 'malguard-sandbox-containment-probe'
          cmake -S native/sandbox-containment-probe -B $build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'containment probe configure failed' }
          cmake --build $build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'containment probe build failed' }
          $probe = Get-ChildItem -LiteralPath $build -Filter 'MalGuardSandboxContainmentProbe.exe' -File -Recurse | Select-Object -First 1
          if (-not $probe) { throw 'MalGuardSandboxContainmentProbe.exe was not produced' }
          New-Item -ItemType Directory -Path 'desktop-app/sandbox/bin' -Force | Out-Null
          Copy-Item -LiteralPath $probe.FullName -Destination 'desktop-app/sandbox/bin/MalGuardSandboxContainmentProbe.exe' -Force

      - name: Prove independent engines execute
        shell: pwsh
        run: |
          node -e "const {runExternalEngines}=require('./desktop-app/multiengine/external-engine-runner.js'); (async()=>{const r=await runExternalEngines('desktop-app/bin/MalGuard.exe'); console.log(JSON.stringify(r,null,2)); for(const n of ['yara_x','capa']){const e=r.engines.find(x=>x.name===n); if(!e||e.status==='unavailable'||e.status==='error') throw new Error(n+' did not execute');}})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Build and verify sealed runtime package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -A
          git commit -m "ephemeral: stage verified Windows runtime dependencies"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit staged runtime dependencies for provenance' }
          $runtimeSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          "MALGUARD_SOURCE_COMMIT=$runtimeSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node tools/build-portable-package.js
          node tools/verify-release-candidate.js
          if ($LASTEXITCODE -ne 0) { throw 'Release candidate verification failed' }

      - name: Build Claude telemetry test EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $root = Join-Path (Get-Location) "dist/malguard-desktop-$version"
          $setup = Join-Path (Get-Location) "dist/MalGuard-Claude-Telemetry-Test-$version-delta-dd578187-windows-x64.exe"
          $diag = Join-Path $env:RUNNER_TEMP 'malguard-claude-telemetry-installer-test-x64'
          & pwsh -NoLogo -NoProfile -NonInteractive -File .\tools\build-windows-installer.ps1 -PackageRoot $root -Architecture 'x64' -OutputPath $setup -DiagnosticOutputDirectory $diag
          if ($LASTEXITCODE -ne 0) { throw "Windows installer builder failed with exit code $LASTEXITCODE" }
          $bytes = [IO.File]::ReadAllBytes($setup)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Installer does not have an MZ executable header' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($setup))" | Set-Content -LiteralPath "$setup.sha256" -Encoding ascii
          @(
            "purpose=Claude opt-in telemetry comparison test only"
            "base_commit=1977b2209e69705fa8d4273642fb12829ca50658"
            "claude_delta_sha256=dd5781874467d2599eb83c4a4cf02db7dd78a037b815dcc83cca136224ec2cff"
            "ephemeral_source_commit=$env:CLAUDE_LOCAL_COMMIT"
            "runtime_source_commit=$env:MALGUARD_SOURCE_COMMIT"
            "version=$version"
            "platform=windows-x64"
            "signing=unsigned-test-preview"
            "installer_sha256=$hash"
          ) | Set-Content -LiteralPath 'dist/CLAUDE-TELEMETRY-TEST-PROVENANCE.txt' -Encoding ascii
          Write-Host "Installer SHA-256: $hash"

      - name: Install payload and verify local runtime startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath 'DESKTOP-VERSION' -Raw).Trim()
          $installScript = Join-Path $env:RUNNER_TEMP 'malguard-claude-telemetry-installer-test-x64/install.ps1'
          $installedRoot = Join-Path $env:LOCALAPPDATA 'Programs/MalGuard'
          $installedNode = Join-Path $installedRoot 'desktop-app/runtime/node.exe'
          try {
            & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $installScript
            if ($LASTEXITCODE -ne 0) { throw "Install script failed with exit code $LASTEXITCODE" }
            foreach ($relative in @(
              'PACKAGE-MANIFEST.json',
              'SHA256SUMS.txt',
              'app.js',
              'desktop-app/server.js',
              'desktop-app/local-scan-upload.js',
              'desktop-app/runtime/node.exe',
              'desktop-app/engines/yara-x/yr.exe',
              'desktop-app/engines/capa/capa.exe'
            )) {
              if (-not (Test-Path -LiteralPath (Join-Path $installedRoot $relative) -PathType Leaf)) {
                throw "Installed payload missing: $relative"
              }
            }
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:18777/api/status' -TimeoutSec 2
                if ($status.ok -eq $true -and $status.product -eq 'MalGuard Desktop' -and $status.version -eq $version) {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Installed Claude telemetry preview did not become ready at /api/status' }
            Write-Host 'Installed payload runtime startup PASS.'
          } finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -and [string]::Equals($_.ExecutablePath, $installedNode, [StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload verified Claude telemetry EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malguard-claude-telemetry-test-windows-x64
          path: |
            dist/MalGuard-Claude-Telemetry-Test-*-windows-x64.exe
            dist/MalGuard-Claude-Telemetry-Test-*-windows-x64.exe.sha256
            dist/CLAUDE-TELEMETRY-TEST-PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
