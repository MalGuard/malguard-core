name: Publish MalGuard App Preview Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-native-app-preview-now.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '35871258083'
      SOURCE_SHA: '06ad95666310350dc97a8ffac77d29d9678948ac'
      RELEASE_TAG: 'app-v0.1.0-preview.1'
    steps:
      - name: Download verified native app artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads release-out
          for artifact in malguard-android-preview malguard-windows-app-preview malguard-macos-app-preview malguard-ios-simulator-preview; do
            mkdir -p "downloads/$artifact"
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "downloads/$artifact"
          done
          cp downloads/malguard-android-preview/MalGuard-App-Preview-Android.apk* release-out/
          cp downloads/malguard-windows-app-preview/MalGuard-App-Preview-Windows-x64-Setup.exe* release-out/
          cp downloads/malguard-macos-app-preview/MalGuard-App-Preview-macOS.zip* release-out/
          cp downloads/malguard-ios-simulator-preview/MalGuard-iOS-Simulator-Preview.zip* release-out/

      - name: Verify every artifact checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-out
          for sum in *.sha256; do
            tr -d '\r' < "$sum" > "$sum.normalized"
            sha256sum -c "$sum.normalized"
            rm "$sum.normalized"
          done

      - name: Publish permanent preview release
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          MalGuard App Preview uses the official MalGuard production website as its application interface.

          Downloads:
          - Android / Samsung: installable APK preview.
          - Windows x64: installer preview.
          - macOS: zipped unsigned app preview.
          - iOS: simulator-only developer build. This is not an installable iPhone package.

          Windows and macOS preview packages are not production-signed. iPhone device distribution requires Apple signing and TestFlight/App Store distribution.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-out/* --clobber
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "MalGuard App Preview 0.1.0" --notes-file release-notes.md release-out/*
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
