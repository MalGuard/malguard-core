name: MalGuard Native App Shell

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app-shell/**'
      - '.github/workflows/native-app-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Validate native shell policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const mobilePackage = JSON.parse(fs.readFileSync('app-shell/mobile/package.json', 'utf8'));
          const desktopPackage = JSON.parse(fs.readFileSync('app-shell/desktop/package.json', 'utf8'));
          const tauri = JSON.parse(fs.readFileSync('app-shell/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const capacitor = fs.readFileSync('app-shell/mobile/capacitor.config.ts', 'utf8');
          const readme = fs.readFileSync('app-shell/README.md', 'utf8');

          const origin = 'https://malguard.github.io/';
          if (!capacitor.includes("url: '" + origin + "'")) throw new Error('Capacitor production origin changed');
          if (capacitor.includes('cleartext: true')) throw new Error('Cleartext mobile traffic must stay disabled');
          if (!capacitor.includes("allowNavigation: ['malguard.github.io']")) throw new Error('Unexpected mobile navigation allowlist');

          if (tauri.build.frontendDist !== origin) throw new Error('Tauri production origin changed');
          if (!tauri.app || !tauri.app.security || !Array.isArray(tauri.app.security.capabilities) || tauri.app.security.capabilities.length !== 0) {
            throw new Error('Remote desktop content must have zero Tauri capabilities');
          }

          if (mobilePackage.private !== true || desktopPackage.private !== true) throw new Error('App shell packages must remain private');
          if (!readme.includes('must not introduce a second product UI')) throw new Error('UI source-of-truth policy missing');

          const forbidden = [
            /shell:allow/i,
            /fs:allow/i,
            /process:allow/i,
            /command execution/i
          ];
          const tauriRaw = fs.readFileSync('app-shell/desktop/src-tauri/tauri.conf.json', 'utf8');
          for (const pattern of forbidden) {
            if (pattern.test(tauriRaw)) throw new Error('Forbidden native capability found: ' + pattern);
          }

          console.log('Native shell policy PASS');
          NODE

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('app-shell/mobile/package.json','utf8')); JSON.parse(require('fs').readFileSync('app-shell/desktop/package.json','utf8')); JSON.parse(require('fs').readFileSync('app-shell/desktop/src-tauri/tauri.conf.json','utf8'));"
          cargo metadata --manifest-path app-shell/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null

  android-preview:
    needs: validate-shell
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned major mobile toolchain
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx cap --version

      - name: Generate Android native project
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Build Android preview APK
        working-directory: app-shell/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload Android preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-android-preview
          path: |
            app-shell/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            app-shell/mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
