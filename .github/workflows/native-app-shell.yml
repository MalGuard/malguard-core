name: MalGuard Native App Shell

# Release trigger revision: 2

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app-shell/**'
      - '.github/workflows/native-app-shell.yml'
      - '.github/workflows/native-app-release.yml'
  push:
    branches:
      - main
    paths:
      - 'app-shell/**'
      - '.github/workflows/native-app-shell.yml'
      - '.github/workflows/native-app-release.yml'
  workflow_dispatch:
    inputs:
      release_publish:
        description: Build verified native artifacts for preview release publishing
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  validate-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Prepare locked offline site
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/prepare-offline-site.js
          test -f app-shell/mobile/www/OFFLINE-SOURCE.json

      - name: Download locked offline AI runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: malguard-offline-ai-runtime
          path: app-shell/offline-ai/dist

      - name: Stage fully offline AI into Android app
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/stage-offline-ai.js app-shell/mobile/www
          test -s app-shell/mobile/www/models/malguard-qwen2.5-0.5b-instruct/onnx/model_q4.onnx
          test -s app-shell/mobile/www/assets/offline-ai/offline-ai-engine.mjs
          test -f app-shell/desktop/www/OFFLINE-SOURCE.json
          test -f app-shell/mobile/www/index.html
          test -f app-shell/desktop/www/index.html
          grep -q '/assets/offline-ai/offline-malware-ai-bootstrap.js' app-shell/mobile/www/index.html
          grep -q '/assets/offline-ai/offline-malware-ai-bootstrap.js' app-shell/desktop/www/index.html
          ! grep -Eq 'connect-src[^;]*malware-ai-gray\.vercel\.app' app-shell/mobile/www/index.html

      - name: Validate native shell policy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const mobilePackage = JSON.parse(fs.readFileSync('app-shell/mobile/package.json', 'utf8'));
          const desktopPackage = JSON.parse(fs.readFileSync('app-shell/desktop/package.json', 'utf8'));
          const tauri = JSON.parse(fs.readFileSync('app-shell/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const capacitor = fs.readFileSync('app-shell/mobile/capacitor.config.ts', 'utf8');
          const readme = fs.readFileSync('app-shell/README.md', 'utf8');

          const lock = JSON.parse(fs.readFileSync('app-shell/site-lock.json', 'utf8'));
          if (lock.repository !== 'MalGuard/malguard.github.io' || !/^[a-f0-9]{40}$/.test(lock.commit)) {
            throw new Error('Offline site lock is invalid');
          }
          const aiLock = JSON.parse(fs.readFileSync('app-shell/offline-ai/model-lock.json', 'utf8'));
          if (
            aiLock.repository !== 'onnx-community/Qwen2.5-0.5B-Instruct' ||
            aiLock.commit !== '516c8d04add8a80c5228f32102b57953b8d421a9' ||
            aiLock.dtype !== 'q4' ||
            aiLock.modelSha256 !== '09235a3b1c135cd04ef570e5053b5c079e028078a2cc5f76ba6a251e91bf3296'
          ) {
            throw new Error('Offline AI model lock is invalid');
          }
          if (capacitor.includes('server:') || capacitor.includes('https://malguard.github.io/')) {
            throw new Error('Capacitor must load only the bundled local site');
          }
          if (tauri.build.frontendDist !== '../www') throw new Error('Tauri must load the bundled local site');
          if (JSON.stringify(tauri).includes('https://malguard.github.io/')) throw new Error('Tauri config must not use the live site as its frontend');
          if (!tauri.app || !tauri.app.security || !Array.isArray(tauri.app.security.capabilities) || tauri.app.security.capabilities.length !== 0) {
            throw new Error('Bundled desktop content must have zero Tauri capabilities');
          }

          if (mobilePackage.private !== true || desktopPackage.private !== true) throw new Error('App shell packages must remain private');
          if (!readme.includes('must not introduce a second product UI')) throw new Error('UI source-of-truth policy missing');
          if (!readme.includes('bundles a locked snapshot')) throw new Error('Offline bundle policy missing');

          const forbidden = [
            /shell:allow/i,
            /fs:allow/i,
            /process:allow/i,
            /command execution/i
          ];
          const tauriRaw = fs.readFileSync('app-shell/desktop/src-tauri/tauri.conf.json', 'utf8');
          for (const pattern of forbidden) {
            if (pattern.test(tauriRaw)) throw new Error('Forbidden native capability found: ' + pattern);
          }

          console.log('Native shell policy PASS');
          NODE

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('app-shell/mobile/package.json','utf8')); JSON.parse(require('fs').readFileSync('app-shell/desktop/package.json','utf8')); JSON.parse(require('fs').readFileSync('app-shell/desktop/src-tauri/tauri.conf.json','utf8'));"
          cargo metadata --manifest-path app-shell/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null

  offline-ai-assets:
    needs: validate-shell
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Install pinned offline AI build dependency
        working-directory: app-shell/offline-ai
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund

      - name: Prepare locked fully offline AI runtime
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/prepare-offline-ai.js
          test -s app-shell/offline-ai/dist/OFFLINE-AI-SOURCE.json
          test -s app-shell/offline-ai/dist/vendor/transformers.web.min.js
          test -s app-shell/offline-ai/dist/vendor/ort-wasm-simd-threaded.jsep.wasm
          test -s app-shell/offline-ai/dist/models/malguard-qwen2.5-0.5b-instruct/onnx/model_q4.onnx
          actual="$(sha256sum app-shell/offline-ai/dist/models/malguard-qwen2.5-0.5b-instruct/onnx/model_q4.onnx | awk '{print $1}')"
          test "$actual" = "09235a3b1c135cd04ef570e5053b5c079e028078a2cc5f76ba6a251e91bf3296"

      - name: Upload locked offline AI runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-offline-ai-runtime
          path: app-shell/offline-ai/dist
          if-no-files-found: error
          retention-days: 1

  android-preview:
    needs:
      - validate-shell
      - offline-ai-assets
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare locked offline site
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/prepare-offline-site.js
          test -f app-shell/mobile/www/OFFLINE-SOURCE.json

      - name: Download locked offline AI runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: malguard-offline-ai-runtime
          path: app-shell/offline-ai/dist

      - name: Stage fully offline AI into iOS app
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/stage-offline-ai.js app-shell/mobile/www
          test -s app-shell/mobile/www/models/malguard-qwen2.5-0.5b-instruct/onnx/model_q4.onnx

      - name: Install pinned major mobile toolchain
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx cap --version

      - name: Generate Android native project
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Build Android preview APK
        working-directory: app-shell/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          source_apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$source_apk"
          mkdir -p ../dist-android
          target='../dist-android/MalGuard-App-Preview-Android.apk'
          cp "$source_apk" "$target"
          (
            cd ../dist-android
            sha256sum MalGuard-App-Preview-Android.apk > MalGuard-App-Preview-Android.apk.sha256
            cat MalGuard-App-Preview-Android.apk.sha256
          )

      - name: Upload Android preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-android-preview
          path: |
            app-shell/mobile/dist-android/MalGuard-App-Preview-Android.apk
            app-shell/mobile/dist-android/MalGuard-App-Preview-Android.apk.sha256
          if-no-files-found: error
          retention-days: 7


  windows-preview:
    needs:
      - validate-shell
      - offline-ai-assets
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Prepare locked offline site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node app-shell/scripts/prepare-offline-site.js
          if (-not (Test-Path -LiteralPath 'app-shell/desktop/www/OFFLINE-SOURCE.json' -PathType Leaf)) { throw 'offline desktop bundle missing' }

      - name: Download locked offline AI runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: malguard-offline-ai-runtime
          path: app-shell/offline-ai/dist

      - name: Stage fully offline AI into Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node app-shell/scripts/stage-offline-ai.js app-shell/desktop/www
          if (-not (Test-Path -LiteralPath 'app-shell/desktop/www/models/malguard-qwen2.5-0.5b-instruct/onnx/model_q4.onnx' -PathType Leaf)) { throw 'offline model missing from Windows bundle' }

      - name: Record Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version

      - name: Install desktop shell dependencies
        working-directory: app-shell/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --ignore-scripts --no-audit --no-fund
          npx tauri --version

      - name: Generate MalGuard desktop icons
        working-directory: app-shell/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx tauri icon ../assets/malguard-app-icon.svg
          if (-not (Test-Path -LiteralPath 'src-tauri/icons/icon.ico' -PathType Leaf)) { throw 'Windows icon was not generated' }
          if (-not (Test-Path -LiteralPath 'src-tauri/icons/icon.png' -PathType Leaf)) { throw 'PNG icon was not generated' }

      - name: Build Windows preview installer
        working-directory: app-shell/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build -- --bundles nsis
          $setup = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $setup) { throw 'Tauri Windows NSIS installer was not produced' }
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $target = Join-Path (Resolve-Path 'dist') 'MalGuard-App-Preview-Windows-x64-Setup.exe'
          Copy-Item -LiteralPath $setup.FullName -Destination $target -Force
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MalGuard-App-Preview-Windows-x64-Setup.exe" | Set-Content -LiteralPath "$target.sha256" -Encoding ascii

      - name: Upload Windows preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-windows-app-preview
          path: |
            app-shell/desktop/dist/MalGuard-App-Preview-Windows-x64-Setup.exe
            app-shell/desktop/dist/MalGuard-App-Preview-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  macos-preview:
    needs:
      - validate-shell
      - offline-ai-assets
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Prepare locked offline site
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/prepare-offline-site.js
          test -f app-shell/desktop/www/OFFLINE-SOURCE.json

      - name: Download locked offline AI runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: malguard-offline-ai-runtime
          path: app-shell/offline-ai/dist

      - name: Stage fully offline AI into macOS app
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/stage-offline-ai.js app-shell/desktop/www
          test -s app-shell/desktop/www/models/malguard-qwen2.5-0.5b-instruct/onnx/model_q4.onnx

      - name: Record Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version

      - name: Install desktop shell dependencies
        working-directory: app-shell/desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx tauri --version

      - name: Generate MalGuard desktop icons
        working-directory: app-shell/desktop
        shell: bash
        run: |
          set -euo pipefail
          npx tauri icon ../assets/malguard-app-icon.svg
          test -s src-tauri/icons/icon.icns
          test -s src-tauri/icons/icon.png

      - name: Build macOS preview app
        working-directory: app-shell/desktop
        shell: bash
        run: |
          set -euo pipefail
          npm run build -- --bundles app
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/MalGuard-App-Preview-macOS.zip
          (
            cd dist
            shasum -a 256 MalGuard-App-Preview-macOS.zip > MalGuard-App-Preview-macOS.zip.sha256
            cat MalGuard-App-Preview-macOS.zip.sha256
          )

      - name: Upload macOS preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-macos-app-preview
          path: |
            app-shell/desktop/dist/MalGuard-App-Preview-macOS.zip
            app-shell/desktop/dist/MalGuard-App-Preview-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 7

  ios-simulator-preview:
    needs:
      - validate-shell
      - offline-ai-assets
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'

      - name: Prepare locked offline site
        shell: bash
        run: |
          set -euo pipefail
          node app-shell/scripts/prepare-offline-site.js
          test -f app-shell/mobile/www/OFFLINE-SOURCE.json

      - name: Install mobile shell dependencies
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npx cap --version

      - name: Generate iOS native project
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          test -d ios/App

      - name: Build iOS Simulator preview
        working-directory: app-shell/mobile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-ios dist-ios
          mkdir -p dist-ios
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild               -workspace ios/App/App.xcworkspace               -scheme App               -configuration Debug               -destination 'generic/platform=iOS Simulator'               -derivedDataPath build-ios               CODE_SIGNING_ALLOWED=NO               build
          else
            xcodebuild               -project ios/App/App.xcodeproj               -scheme App               -configuration Debug               -destination 'generic/platform=iOS Simulator'               -derivedDataPath build-ios               CODE_SIGNING_ALLOWED=NO               build
          fi
          app="$(find build-ios/Build/Products -maxdepth 3 -type d -name 'App.app' | head -n 1)"
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist-ios/MalGuard-iOS-Simulator-Preview.zip
          (
            cd dist-ios
            shasum -a 256 MalGuard-iOS-Simulator-Preview.zip > MalGuard-iOS-Simulator-Preview.zip.sha256
            cat MalGuard-iOS-Simulator-Preview.zip.sha256
          )

      - name: Upload iOS Simulator preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: malguard-ios-simulator-preview
          path: |
            app-shell/mobile/dist-ios/MalGuard-iOS-Simulator-Preview.zip
            app-shell/mobile/dist-ios/MalGuard-iOS-Simulator-Preview.zip.sha256
          if-no-files-found: error
          retention-days: 7
