# Official OpenSSF Scorecard Action for a public open-source repository.
# Based on https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml
# Security: pin third-party actions to immutable full commit SHAs.
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 2 * * 6'

permissions: read-all

jobs:
  analysis:
    name: Analyze repository security
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Publish findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
