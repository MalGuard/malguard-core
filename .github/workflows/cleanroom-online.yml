name: Clean-room MalGuard online desktop and signed intelligence

on:
  push:
    branches: [main]
    paths: ['cleanroom-v1/**', '.github/workflows/cleanroom-online.yml']
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanroom-online-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify and unpack the clean-room source
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          data=Path('cleanroom-v1/source.zip').read_bytes()
          manifest=json.loads(Path('cleanroom-v1/source.json').read_text())
          assert hashlib.sha256(data).hexdigest()==manifest['sha256']
          with zipfile.ZipFile('cleanroom-v1/source.zip') as archive:
              assert len(archive.infolist()) < 1024
              assert sum(item.file_size for item in archive.infolist()) < 32*1024*1024
              for item in archive.infolist():
                  path=Path(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in item.filename
              archive.extractall('cleanroom-source')
          PY
      - name: Install the verified locked graph
        working-directory: cleanroom-source
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Authenticate metadata and sign the candidate
        env:
          MALGUARD_ABUSECH_AUTH_KEY: ${{ secrets.MALGUARD_ABUSECH_AUTH_KEY }}
          MALGUARD_UPDATE_SIGNING_KEY: ${{ secrets.MALGUARD_UPDATE_SIGNING_KEY }}
          UPDATE_EPOCH: ${{ github.run_id }}
          UPDATE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          epoch=$((UPDATE_EPOCH * 1000 + UPDATE_ATTEMPT))
          python cleanroom-source/packaging/online/publish_feed.py --output cleanroom-updates/latest.json --epoch "$epoch"
      - name: Publish only authenticated security data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          from pathlib import Path
          url='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/contents/cleanroom-updates/latest.json'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url+'?ref=main',headers=headers),timeout=30) as response:sha=json.load(response)['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:raise
          payload={'message':'Refresh authenticated MalwareBazaar metadata','branch':'main','content':base64.b64encode(Path('cleanroom-updates/latest.json').read_bytes()).decode()}
          if sha:payload['sha']=sha
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(payload).encode(),headers=headers,method='PUT'),timeout=60) as response:
              result=json.load(response)
          print('Signed feed commit:',result['commit']['sha'])
          PY

  windows-desktop:
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify and unpack the clean-room source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content cleanroom-v1/source.json -Raw | ConvertFrom-Json
          $actual=(Get-FileHash cleanroom-v1/source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256) {throw 'Source integrity mismatch'}
          Expand-Archive -LiteralPath cleanroom-v1/source.zip -DestinationPath cleanroom-source
      - name: Verify privileged installation ACL helper before building
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture=Join-Path $env:ProgramFiles 'MalGuard'
          if (Test-Path $fixture) {throw 'Installation fixture already exists'}
          New-Item -ItemType Directory -Path (Join-Path $fixture 'engine') -Force | Out-Null
          try {
            Set-Content -LiteralPath (Join-Path $fixture 'engine/harmless.txt') -Value 'Harmless permission fixture'
            $script=(Resolve-Path cleanroom-source/desktop/protect-install.ps1).Path
            & "$env:SystemRoot\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -Directory $fixture
            if ($LASTEXITCODE -ne 0) {throw '32-bit installer ACL helper failed'}
            foreach ($path in @($fixture,(Join-Path $fixture 'engine'),(Join-Path $fixture 'engine/harmless.txt'))) {
              $acl=Get-Acl -LiteralPath $path
              if ($acl.Owner -notmatch 'Administrators$|SYSTEM$' -or -not $acl.AreAccessRulesProtected) {throw 'Fixture ACL owner/protection invalid'}
              foreach ($ace in $acl.Access) {
                if ($ace.IdentityReference -match 'Users$' -and ($ace.FileSystemRights -band [Security.AccessControl.FileSystemRights]::Write) -ne 0) {throw 'Fixture grants user write'}
              }
            }
            Write-Output 'Protected directory/file ACLs verified through the installer PowerShell architecture'
          } finally {Remove-Item -LiteralPath $fixture -Recurse -Force}
      - name: Provision verified CPython 3.12.15 Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.12.15%2B20261003-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile python-runtime.tar.gz
          $hash=(Get-FileHash python-runtime.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '4b6f0beebbb695a0f3ea237b8c3eaa5bd424f47a7bc25b2fbe3a43390c770f08') {throw 'Python runtime integrity mismatch'}
          New-Item -ItemType Directory -Path runtime315 | Out-Null
          tar -xzf python-runtime.tar.gz -C runtime315
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $runtime=Join-Path (Get-Location) 'runtime315/python/python.exe'
          & $runtime -I -c "import sys; assert sys.version_info[:3] == (3,12,15)"
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          & $runtime -I -m pip install --require-hashes -r cleanroom-source/requirements-lock.txt
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          & $runtime -I -m pip install --require-hashes -r cleanroom-source/packaging/windows/build-requirements-lock.txt
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          & $runtime -I -m pip install --no-deps --no-build-isolation ./cleanroom-source
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          "MALGUARD_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked Python engine and packager
        working-directory: cleanroom-source
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install --require-hashes -r packaging/windows/build-requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Synthetic tests and type checks on native Windows
        working-directory: cleanroom-source
        run: |
          python -m pytest -q --junitxml=windows-tests.xml
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m mypy --platform win32 malguard_core malguard_cli
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Build and test trusted frozen engine
        working-directory: cleanroom-source
        run: |
          & $env:MALGUARD_RUNTIME -I -m PyInstaller --noconfirm --clean --distpath desktop/engine --workpath windows-work packaging/windows/MalGuard.spec
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          & desktop/engine/MalGuard/MalGuard.exe --self-test
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          & desktop/engine/MalGuard/MalGuard.exe --security-status
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Select pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install locked native UI builder
        working-directory: cleanroom-source/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch checksum-locked native dependencies
        working-directory: cleanroom-source/desktop
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Bundle Python and native dependency license notices
        shell: pwsh
        run: |
          @'
          import importlib.util,shutil,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('trusted_packager','cleanroom-source/packaging/windows/package_release.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          runtime=Path(__import__('os').environ['MALGUARD_RUNTIME']).parent
          target=Path('cleanroom-source/desktop/engine/MalGuard/THIRD-PARTY-NOTICES')
          module.copy_notices(runtime,target,None)
          for path in Path('cleanroom-source/packaging/windows/notices').iterdir():shutil.copy2(path,target/path.name)
          for directory in (Path.home()/'.cargo/registry/src').glob('*/*'):
              for path in directory.glob('*'):
                  if path.is_file() and any(word in path.name.upper() for word in ['LICENSE','NOTICE','COPYING']):
                      dest=target/'Rust'/directory.name/path.name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(path,dest)
          print('Redistribution notices bundled')
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Generate brand icons and build native installer
        working-directory: cleanroom-source/desktop
        run: |
          npx --no-install tauri icon icon.svg
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 | Out-File cargo-metadata.json
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          npm run build -- --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Hash the installer and prepare verification artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path verified-desktop | Out-Null
          $setup=Get-ChildItem cleanroom-source/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) {throw 'Native GUI installer missing'}
          Copy-Item $setup.FullName verified-desktop/MalGuard-Online-Setup-x64.exe
          $hash=(Get-FileHash verified-desktop/MalGuard-Online-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MalGuard-Online-Setup-x64.exe" | Set-Content verified-desktop/MalGuard-Online-Setup-x64.exe.sha256 -Encoding ascii
          Copy-Item cleanroom-source/windows-tests.xml verified-desktop/
          Copy-Item cleanroom-source/desktop/src-tauri/Cargo.lock verified-desktop/
      - name: Verify native GUI installation, startup, scheduler and uninstall
        shell: pwsh
        run: |
          & cleanroom-source/packaging/online/smoke_gui_install.ps1 -Setup verified-desktop/MalGuard-Online-Setup-x64.exe -Output verified-desktop/gui-install-qa.json
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Encrypt installer before artifact upload
        shell: pwsh
        run: |
          @'
          import os,struct
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.serialization import load_pem_public_key
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('verified-desktop')
          data=(root/'MalGuard-Online-Setup-x64.exe').read_bytes()
          assert 0 < len(data) <= 64*1024*1024
          key=os.urandom(32);nonce=os.urandom(12)
          public=load_pem_public_key(Path('cleanroom-v1/artifact-public.pem').read_bytes())
          wrapped=public.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          sealed=b'MGBUILD1'+struct.pack('>I',len(wrapped))+wrapped+nonce+AESGCM(key).encrypt(nonce,data,b'MalGuard clean-room desktop 1.1.0')
          (root/'MalGuard-Online-Setup-x64.exe.sealed').write_bytes(sealed)
          (root/'MalGuard-Online-Setup-x64.exe').unlink()
          print('Installer encrypted for the delivery owner; no plaintext installer uploaded')
          '@ | python -
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: malguard-cleanroom-online-windows
          path: verified-desktop
          if-no-files-found: error
          retention-days: 14
