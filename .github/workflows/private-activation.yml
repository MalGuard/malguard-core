name: MalGuard private activation Windows validation

on:
  push:
    branches: [codex/malguard-private-1-3]
    paths: ['private-delivery/**', '.github/workflows/private-activation.yml']

permissions:
  contents: read

jobs:
  activation:
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse delivery scripts on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach ($path in @('private-delivery/Activate-MalGuard.ps1','private-delivery/test-activation.ps1')) {
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {throw ($errors | Out-String)}
          }
      - name: Verify device comparison, setup checksum and protected license placement
        shell: powershell
        run: |
          & private-delivery/test-activation.ps1 -Output activation-qa.json
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: always()
        with:
          ref: codex/malguard-private-1-3-artifacts
          path: delivery-output
          persist-credentials: false
      - name: Publish only activation verification metadata
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item -LiteralPath activation-qa.json -Destination delivery-output/activation-qa.json
          # Authenticate this Git process only; no credential is saved in .git.
          $authorization=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:'+$env:GH_TOKEN))
          Write-Output ('::add-mask::'+$authorization)
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+$authorization
          Push-Location delivery-output
          try {
            git config user.name 'MalGuard private build'
            git config user.email 'malguard-build@users.noreply.github.com'
            git add -- activation-qa.json
            git commit -m 'Verify private activation on Windows'
            if ($LASTEXITCODE -ne 0) {throw 'Activation evidence commit failed'}
            git pull --rebase origin codex/malguard-private-1-3-artifacts
            if ($LASTEXITCODE -ne 0) {throw 'Activation evidence synchronization failed'}
            git push origin HEAD:codex/malguard-private-1-3-artifacts
            if ($LASTEXITCODE -ne 0) {throw 'Activation evidence push failed'}
          } finally {
            Pop-Location
            Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }
