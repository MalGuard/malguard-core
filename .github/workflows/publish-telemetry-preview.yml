name: Publish Telemetry Preview

on:
  push:
    branches:
      - publish/telemetry-preview-72ec93ef
    paths:
      - '.github/workflows/publish-telemetry-preview.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified telemetry preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10915540878'
        run: |
          set -euo pipefail
          mkdir -p artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          unzip -q artifact.zip -d artifact
          find artifact -maxdepth 2 -type f -printf '%p\n'

      - name: Verify installer checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXE="$(find artifact -type f -name 'MalGuard-Telemetry-Preview-*-windows-x64.exe' -print -quit)"
          SUM="$(find artifact -type f -name 'MalGuard-Telemetry-Preview-*-windows-x64.exe.sha256' -print -quit)"
          test -n "$EXE"
          test -n "$SUM"
          EXPECTED="$(awk '{print $1}' "$SUM" | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(sha256sum "$EXE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          test "$EXPECTED" = "$ACTUAL"
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "sum=$SUM" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Create public telemetry prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: telemetry-preview-72ec93ef
          TARGET_SHA: 72ec93ef223ec62e3a8df5df9d3c0a536bae41f4
          EXE: ${{ steps.verify.outputs.exe }}
          SUM: ${{ steps.verify.outputs.sum }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" "$SUM" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$EXE" "$SUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "MalGuard Telemetry Preview · build 72ec93ef" \
              --prerelease \
              --notes "Unsigned Windows x64 telemetry preview for manual testing. TSH Telemetry PASS, TSH Pro PASS, Security CI PASS, Windows install/runtime verification PASS. Build: 72ec93ef223ec62e3a8df5df9d3c0a536bae41f4. SHA-256: $SHA256"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,isPrerelease