name: TSH Main - Full Program 10-Stage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1:
    name: "TSH 1/10 · Source & Release Identity"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }
      - run: node tests/tsh-main-10stage.js stage1

  stage2:
    name: "TSH 2/10 · Packaging & Update Hardening"
    needs: stage1
    runs-on: ubuntu-latest
    timeout-minutes: 20
