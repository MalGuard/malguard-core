      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }
      - run: node tests/tsh-main-10stage.js stage2

  stage3:
    name: "TSH 3/10 · Static Detection & Fuzzing"
    needs: stage2
