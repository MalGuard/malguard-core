version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/app-shell/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/app-shell/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "cargo"
    directory: "/app-shell/desktop/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
