[package]
name = "malguard-app"
version = "0.1.0"
description = "MalGuard native desktop shell"
authors = ["MalGuard"]
edition = "2021"

[lib]
name = "malguard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
